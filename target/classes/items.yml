# ============================================================
#  SenzyShop V1.0 - items.yml
#  Semua item toko berasal dari file ini.
#
#  Field:
#    material   : nama Material Bukkit (contoh DIAMOND_ORE)
#    category   : NATURAL | ORE | FARMING | ANIMALS | FOOD
#    enabled    : true/false
#    buy-price  : harga beli pemain (Senzy Coin, bilangan bulat). 0 = tidak dijual
#    sell-price : harga jual pemain. 0 = tidak bisa dijual. Harus <= buy-price
#    stock      : min / max jumlah stok saat restock, chance = peluang muncul (0-100)
#    worlds     : (opsional) daftar world tempat item boleh ditransaksikan
#
#  Item Netherite, Ancient Debris, Nether ore, Elytra, Totem, Nether Star
#  otomatis DITOLAK oleh plugin walau ditulis di sini.
# ============================================================
