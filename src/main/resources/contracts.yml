# ============================================================
#  SenzyShop V1.1 - contracts.yml
#
#  Kumpulan (pool) kandidat kontrak. Setiap kali reset (daily/weekly), plugin memilih
#  SECARA ACAK sejumlah "random-count" kontrak dari pool ini - target & reward SELALU
#  tetap sesuai yang ditulis di sini (tidak pernah di-random).
#
#  "item" WAJIB berupa id item di items.yml yang bisa dijual (sell-price > 0).
# ============================================================

