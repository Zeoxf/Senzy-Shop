name: Build SenzyShop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Show build output
        run: |
          echo "=== TARGET ==="
          ls -lah target || true
          echo "=== JAR FILES ==="
          find target -maxdepth 1 -type f -name "*.jar" -print || true

      - name: Prepare JAR ZIP
        run: |
          mkdir -p release/jar
          cp target/*.jar release/jar/SenzyShop.jar

          cd release/jar
          zip -r ../../SenzyShop-JAR.zip SenzyShop.jar

      - name: Prepare Source ZIP
        run: |
          mkdir -p release/source

          cp -r src release/source/
          cp pom.xml release/source/

          if [ -f README.md ]; then
            cp README.md release/source/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE release/source/
          fi

          cd release/source
          zip -r ../../SenzyShop-Source.zip .

      - name: Verify ZIP files
        run: |
          echo "=== JAR ZIP ==="
          ls -lh SenzyShop-JAR.zip
          unzip -l SenzyShop-JAR.zip

          echo ""
          echo "=== SOURCE ZIP ==="
          ls -lh SenzyShop-Source.zip
          unzip -l SenzyShop-Source.zip

      - name: Upload JAR ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SenzyShop-JAR
          path: SenzyShop-JAR.zip
          if-no-files-found: error

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SenzyShop-Source
          path: SenzyShop-Source.zip
          if-no-files-found: error
