name: Build and Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Package Source Code
        run: |
          mkdir -p release/source
          cp -r src release/source/
          cp pom.xml release/source/
          if [ -f README.md ]; then cp README.md release/source/; fi
          if [ -f LICENSE ]; then cp LICENSE release/source/; fi
          cd release/source
          zip -r ../../SenzyShop-Source.zip .
